name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: Verify release version
        run: >-
          node -e 'const v = require("./package.json").version;
          if (process.env.GITHUB_REF_NAME !== `v${v}`) {
          console.error(`Tag ${process.env.GITHUB_REF_NAME} does not match package.json version ${v}`);
          process.exit(1); }'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run coverage
      - run: bun run e2e
      - name: Restore release artifacts
        id: artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: release-packages
          path: dist/release
      - if: steps.artifacts.outcome != 'success'
        run: bun run build:npm
      - if: steps.artifacts.outcome != 'success'
        run: node npm/release.cjs pack dist/npm dist/release
      - if: steps.artifacts.outcome != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: dist/release/
          if-no-files-found: error
      - name: Publish platform packages, then main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node npm/release.cjs publish dist/release
