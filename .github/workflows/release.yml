name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# verify and build run in parallel; publish needs both. Rerunning a failed publish job reruns only
# that job and reuses the tarballs the build job uploaded, so the same bytes go to npm.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify release version
        run: >-
          node -e 'const v = require("./package.json").version;
          if (process.env.GITHUB_REF_NAME !== `v${v}`) {
          console.error(`::error title=Tag does not match package.json::Tag ${process.env.GITHUB_REF_NAME} points at a commit whose package.json version is ${v}. Run bun run release X.Y.Z, commit, and tag that commit. Delete the bad tag with: git push origin :refs/tags/${process.env.GITHUB_REF_NAME}`);
          process.exit(1); }'
      - name: Verify the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Tag is not on main::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Release from main: delete the tag with git push origin :refs/tags/${GITHUB_REF_NAME}, merge the change to main, and tag that commit."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run coverage
      - run: bun run e2e

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run build:npm
      - run: node npm/release.cjs pack dist/npm dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: dist/release/
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One publish at a time across tags; a second release queues instead of racing the first.
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    # Only this job can mint the OIDC token npm trusted publishing exchanges for a publish credential.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release
      - name: Publish platform packages, then main package
        # Authenticates through npm trusted publishing (OIDC); no token is stored.
        run: |
          node npm/release.cjs publish dist/release
